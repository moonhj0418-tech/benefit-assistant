<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>혜택 비서</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4ff; overscroll-behavior: none; }
  [hidden] { display: none !important; }

  .benefit-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 2px 16px rgba(59,130,246,0.07);
    position: relative;
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
  }
  .benefit-card.spent { opacity: 0.55; }
  .swipe-bg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 24px;
    background: linear-gradient(135deg, #ef4444, #f97316);
    border-radius: 20px;
    color: white; font-weight: 700; font-size: 14px;
    opacity: 0; pointer-events: none;
  }
  .card-inner {
    position: relative; z-index: 2;
    background: #fff; border-radius: 20px;
    transition: transform 0.2s cubic-bezier(.22,.68,0,1.2);
  }

  .tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 12px; border-radius: 99px;
    font-size: 12px; font-weight: 700;
    white-space: nowrap; cursor: pointer;
    border: 2px solid transparent;
  }
  .tag-chip:active { transform: scale(0.93); }
  .tag-chip.active { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .tag-default { background: #fff; color: #475569; }
  .tag-smart { background: #eff6ff; color: #2563eb; }
  .tag-urgent { background: #fff7ed; color: #ea580c; }
  .tag-spent { background: #f1f5f9; color: #64748b; }

  .primary-btn {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    box-shadow: 0 8px 20px rgba(99,102,241,0.35);
  }
  .primary-btn:active { transform: scale(0.97); }

  .ai-panel {
    background: linear-gradient(135deg, #eff6ff, #f0f4ff);
    border: 1.5px solid #bfdbfe;
    border-radius: 18px;
  }
  .ai-bubble {
    background: #fff;
    border-radius: 14px 14px 14px 4px;
    box-shadow: 0 2px 12px rgba(59,130,246,0.1);
    animation: popIn 0.25s ease;
  }
  @keyframes popIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: none; } }

  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15,23,42,0.55);
    display: flex; align-items: flex-end;
  }
  .sheet {
    background: #fff;
    border-radius: 28px 28px 0 0;
    width: 100%; max-height: 92vh;
    overflow-y: auto;
    padding-bottom: 60px;
    animation: slideUp 0.28s cubic-bezier(.22,.68,0,1.1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .conf-dot { display:inline-block; width:8px; height:8px; border-radius:99px; margin-right:4px; }
  .conf-high { background: #10b981; }
  .conf-medium { background: #f59e0b; }
  .conf-low { background: #ef4444; }

  .conf-badge-high { background: #d1fae5; color: #065f46; }
  .conf-badge-medium { background: #fef3c7; color: #92400e; }
  .conf-badge-low { background: #fee2e2; color: #991b1b; }

  .log-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid #f1f5f9;
    font-size: 13px; gap: 10px;
  }

  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nav-tab { transition: color 0.15s; }
  .nav-tab.active { color: #3b82f6; }
  .nav-tab:not(.active) { color: #94a3b8; }

  .badge {
    display: inline-block; border-radius: 99px;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px;
  }
  .badge-active { background: #dbeafe; color: #1d4ed8; }
  .badge-spent { background: #e2e8f0; color: #475569; }

  .review-item {
    background: #fff; border-radius: 16px; padding: 12px;
    border: 2px solid transparent;
  }
  .review-item.checked { border-color: #3b82f6; background: #eff6ff; }
  .review-item.failed { border-color: #ef4444; background: #fef2f2; }

  input:focus, textarea:focus, select:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
  }

  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  .caution-box {
    background: #fff7ed;
    border-left: 3px solid #f97316;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #7c2d12;
    line-height: 1.6;
  }
</style>
</head>
<body class="pb-28">

<div id="loadingOverlay" hidden class="fixed inset-0 bg-black/60 z-50 flex flex-col items-center justify-center text-white">
  <div class="spinner mb-5"></div>
  <p class="font-bold text-lg" id="loadingMsg">처리 중...</p>
  <p class="text-sm opacity-70 mt-1">잠시만 기다려 주세요</p>
</div>

<header class="bg-white sticky top-0 z-20 border-b border-slate-100 px-4 py-3 flex justify-between items-center">
  <div>
    <h1 class="text-lg font-black text-blue-600 leading-none">혜택 비서</h1>
    <p class="text-[10px] text-slate-400 mt-0.5" id="summaryText">로딩 중...</p>
  </div>
  <div class="flex gap-2">
    <button id="pendingBadge" hidden onclick="openPendingList()"
      class="w-9 h-9 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 font-bold text-xs relative">
      📝<span id="pendingCount" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full text-[9px] px-1">0</span>
    </button>
    <button onclick="loadData()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">🔄</button>
  </div>
</header>

<div id="homeTab">
  <div class="px-4 pt-4">
    <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100">
      <textarea id="quickInput" rows="2" placeholder="혜택 내용을 붙여넣기(Ctrl+V) 또는 직접 타이핑..."
        class="w-full p-2 text-sm rounded-xl bg-slate-50 border border-slate-200 resize-none"></textarea>
      <div class="flex gap-2 mt-2">
        <label class="flex-1 bg-slate-100 text-slate-700 text-center py-2 rounded-xl font-bold text-sm cursor-pointer active:bg-slate-200">
          📷 파일 선택
          <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFileSelect(event)">
        </label>
        <button onclick="submitQuickInput()" class="primary-btn flex-1 text-white py-2 rounded-xl font-bold text-sm">
          🚀 AI 분석
        </button>
      </div>
      <p class="text-[10px] text-slate-400 text-center mt-1.5">이미지/텍스트 → AI 분석 → 검수 후 저장</p>
    </div>
  </div>

  <div class="px-4 pt-3">
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
      <input id="searchInput" type="text" placeholder="장소, 혜택, 주의사항을 검색하세요"
        class="w-full pl-8 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm"
        oninput="applyFilter()">
    </div>
  </div>

  <div class="px-4 pt-3 overflow-x-auto flex gap-2 scrollbar-hide pb-1" id="tagRow"></div>

  <div class="px-4 pt-2 flex justify-between items-center">
    <span class="text-xs font-bold text-slate-500" id="listTitle">전체 혜택</span>
    <label class="text-[11px] text-slate-500 flex items-center gap-1">
      <input type="checkbox" id="showSpent" onchange="applyFilter()"> 소진 포함
    </label>
  </div>

  <main id="appList" class="px-4 pt-2 space-y-3"></main>

  <div class="px-4 pt-4">
    <div class="ai-panel p-3">
      <p class="text-[11px] font-bold text-blue-500 mb-2">💡 AI에게 상황 설명하고 조언 받기</p>
      <div class="flex gap-2">
        <input id="aiInput" type="text" placeholder="예: 지금 롯데마트에서 5만원 결제할 건데 뭐가 최선이야?"
          class="flex-1 p-2.5 text-sm rounded-xl bg-white border border-blue-100">
        <button onclick="askAI()"
          class="bg-blue-600 text-white px-4 rounded-xl text-sm font-bold whitespace-nowrap">물어보기</button>
      </div>
      <div id="aiResponse" hidden class="mt-3 ai-bubble p-3 text-sm text-slate-700 leading-relaxed"></div>
    </div>
  </div>
</div>

<div id="trashTab" hidden>
  <div class="px-4 pt-4">
    <h2 class="font-bold text-slate-700 mb-1">휴지통</h2>
    <p class="text-[11px] text-slate-400 mb-3">삭제 후 30일 이내 복구 가능. 이후 자동 영구 삭제.</p>
    <div id="trashList" class="space-y-3"></div>
  </div>
</div>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex z-30">
  <button class="nav-tab active flex-1 flex flex-col items-center py-3 text-[10px] font-bold gap-1" onclick="showTab('home',this)">
    <span class="text-xl">🏠</span>혜택
  </button>
  <button class="nav-tab flex-1 flex flex-col items-center py-3 text-[10px] font-bold gap-1" onclick="showTab('trash',this)">
    <span class="text-xl">🗑️</span>휴지통
  </button>
</nav>

<div id="detailOverlay" hidden class="overlay" onclick="closeDetail(event)">
  <div class="sheet" id="detailSheet"></div>
</div>

<div id="reviewListOverlay" hidden class="overlay" onclick="closeReviewList(event)">
  <div class="sheet" id="reviewListSheet"></div>
</div>

<div id="reviewOverlay" hidden class="overlay" onclick="closeReview(event)">
  <div class="sheet" id="reviewSheet"></div>
</div>

<div id="logModal" hidden class="overlay items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-5 w-full max-w-sm">
    <h3 class="font-bold text-slate-800 mb-2">사용 내역 추가</h3>
    <p class="text-[11px] text-slate-500 mb-3">자유롭게 기록하세요. 예: "3/15 2천원 사용, 월 한도 8천원 남음"</p>
    <textarea id="logInput" rows="3" placeholder="사용 내용 메모..."
      class="w-full border border-slate-200 rounded-xl p-3 text-sm mb-3 resize-none"></textarea>
    <div class="flex gap-2">
      <button onclick="closeLogModal()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">취소</button>
      <button onclick="confirmAddLog()" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">추가</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  설정
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwecuQ59BxLdYP11gU5vXrgI-e3Q5S1TRbYtobszDnAIBIsKzQXuOYvQ2ppjmldBklY/exec';

// v4 컬럼 인덱스
const COL = { ID:0, NAME:1, LOCATION:2, BENEFIT:3, CAUTIONS:4, EXPIRY:5, LOG:6, STATUS:7, IMAGE_ID:8, DELETED_AT:9 };

// ============================================================
//  상태
// ============================================================
let allData = [];
let activeTag = 'all';
let pendingItems = [];
let currentLogKey = null;

// ============================================================
//  IndexedDB (Pending)
// ============================================================
const DB_NAME = 'benefitDB';
const STORE_PENDING = 'pending';
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_PENDING)) {
        db.createObjectStore(STORE_PENDING, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(item) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_PENDING, 'readwrite');
    tx.objectStore(STORE_PENDING).put(item);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function dbDelete(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_PENDING, 'readwrite');
    tx.objectStore(STORE_PENDING).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function dbGetAll() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_PENDING, 'readonly');
    const req = tx.objectStore(STORE_PENDING).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function loadPending() {
  pendingItems = await dbGetAll();
  pendingItems.sort((a,b) => b.createdAt - a.createdAt);
  updatePendingBadge();
}
function updatePendingBadge() {
  const badge = document.getElementById('pendingBadge');
  const count = document.getElementById('pendingCount');
  if (pendingItems.length > 0) {
    badge.hidden = false;
    count.textContent = pendingItems.length;
  } else {
    badge.hidden = true;
  }
}

// ============================================================
//  데이터 로드
// ============================================================
async function loadData() {
  document.getElementById('summaryText').textContent = '불러오는 중...';
  const list = document.getElementById('appList');
  list.innerHTML = '<p class="text-center py-12 text-slate-400 text-sm">데이터 로딩 중...</p>';

  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('잘못된 응답');
    const firstRow = data[0];
    const isHeader = firstRow && typeof firstRow[0] === 'string' && firstRow[0].toLowerCase() === 'id';
    allData = (isHeader ? data.slice(1) : data).filter(r => r[COL.NAME] && String(r[COL.NAME]).trim() !== '');
    buildTags();
    applyFilter();
    updateSummary();
    renderTrashList();
  } catch (e) {
    list.innerHTML = '<p class="text-center py-12 text-red-400 text-sm">연결 실패. 🔄 다시 시도하세요.</p>';
    document.getElementById('summaryText').textContent = '연결 오류';
  }
}

function updateSummary() {
  const notTrashed = allData.filter(r => !r[COL.DELETED_AT]);
  const active = notTrashed.filter(r => r[COL.STATUS] !== '소진').length;
  const spent = notTrashed.filter(r => r[COL.STATUS] === '소진').length;
  const trashed = allData.filter(r => r[COL.DELETED_AT]).length;
  let text = `유효 ${active}`;
  if (spent > 0) text += ` · 소진 ${spent}`;
  if (trashed > 0) text += ` · 휴지통 ${trashed}`;
  if (pendingItems.length > 0) text += ` · 검수 ${pendingItems.length}`;
  document.getElementById('summaryText').textContent = text;
}

function rowKey(r) {
  return String(r[COL.NAME]).trim() + '_' + String(r[COL.EXPIRY]).trim();
}

function parseLogs(r) {
  try { return JSON.parse(r[COL.LOG] || '[]'); } catch (_) { return []; }
}

// ============================================================
//  태그
// ============================================================
function buildTags() {
  const tagRow = document.getElementById('tagRow');
  const today = new Date(); today.setHours(0,0,0,0);

  const active = allData.filter(r => !r[COL.DELETED_AT] && r[COL.STATUS] !== '소진');
  const urgent = active.filter(r => {
    const d = new Date(r[COL.EXPIRY]);
    const diff = (d - today) / 86400000;
    return diff >= 0 && diff <= 3;
  });

  const fixed = [{ label: '전체', value: 'all', cls: 'tag-default' }];
  if (urgent.length > 0) fixed.push({ label: `⏰ 마감임박 ${urgent.length}`, value: '__urgent__', cls: 'tag-urgent' });

  const keywords = ['롯데마트','파리바게트','스타벅스','편의점','피부과','카드','네이버페이','카카오페이','캐시백','할인','GS25','CU','이마트'];
  const smart = keywords.filter(k =>
    active.some(r => (String(r[COL.NAME]||'')+String(r[COL.LOCATION]||'')+String(r[COL.BENEFIT]||'')).includes(k))
  );

  tagRow.innerHTML = '';
  fixed.forEach(t => {
    const btn = document.createElement('button');
    btn.className = `tag-chip ${t.cls} ${activeTag === t.value ? 'active' : ''}`;
    btn.textContent = t.label;
    btn.onclick = () => { activeTag = t.value; buildTags(); applyFilter(); };
    tagRow.appendChild(btn);
  });
  smart.forEach(k => {
    const btn = document.createElement('button');
    btn.className = `tag-chip tag-smart ${activeTag === k ? 'active' : ''}`;
    btn.textContent = '#' + k;
    btn.onclick = () => { activeTag = k; buildTags(); applyFilter(); };
    tagRow.appendChild(btn);
  });
}

// ============================================================
//  필터
// ============================================================
function applyFilter() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const showSpent = document.getElementById('showSpent').checked;
  const today = new Date(); today.setHours(0,0,0,0);

  let filtered = allData.filter(r => {
    if (r[COL.DELETED_AT]) return false;
    if (!showSpent && r[COL.STATUS] === '소진') return false;

    if (activeTag === '__urgent__') {
      const d = new Date(r[COL.EXPIRY]);
      const diff = (d - today) / 86400000;
      if (diff < 0 || diff > 3) return false;
    } else if (activeTag !== 'all') {
      const text = String(r[COL.NAME]||'')+String(r[COL.LOCATION]||'')+String(r[COL.BENEFIT]||'');
      if (!text.includes(activeTag)) return false;
    }

    if (q) {
      const text = (String(r[COL.NAME]||'')+String(r[COL.LOCATION]||'')+String(r[COL.BENEFIT]||'')+String(r[COL.CAUTIONS]||'')).toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });

  const list = document.getElementById('appList');
  if (filtered.length === 0) {
    list.innerHTML = '<p class="text-center py-10 text-slate-400 text-sm">해당하는 혜택이 없습니다.</p>';
    document.getElementById('listTitle').textContent = '혜택 없음';
    return;
  }
  filtered.sort((a, b) => new Date(a[COL.EXPIRY]) - new Date(b[COL.EXPIRY]));
  document.getElementById('listTitle').textContent = `${filtered.length}개`;
  list.innerHTML = '';
  filtered.forEach(r => list.appendChild(createCard(r)));
}

// ============================================================
//  카드
// ============================================================
function createCard(r) {
  const key = rowKey(r);
  const logs = parseLogs(r);
  const isSpent = r[COL.STATUS] === '소진';

  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(r[COL.EXPIRY]);
  const diff = Math.ceil((exp - today) / 86400000);
  const dday = isNaN(diff) ? '' : diff < 0 ? '만료' : diff === 0 ? 'D-Day' : `D-${diff}`;
  const ddayColor = diff <= 3 ? 'text-red-500' : diff <= 7 ? 'text-orange-500' : 'text-slate-400';

  const wrapper = document.createElement('div');
  wrapper.className = 'benefit-card' + (isSpent ? ' spent' : '');
  wrapper.dataset.key = key;

  const cautionsHtml = r[COL.CAUTIONS] ?
    `<div class="caution-box mt-2">⚠️ ${escapeHtml(r[COL.CAUTIONS])}</div>` : '';

  const lastLog = logs[logs.length - 1];
  const lastLogHtml = lastLog ?
    `<p class="text-[10px] text-slate-400 mt-2 italic">📝 최근: ${escapeHtml(lastLog.memo).slice(0, 50)}${lastLog.memo.length > 50 ? '...' : ''}</p>` : '';

  wrapper.innerHTML = `
    <div class="swipe-bg">← 밀어서 삭제</div>
    <div class="card-inner p-4">
      <div class="flex justify-between items-start mb-1">
        <div class="flex items-center gap-2">
          <span class="badge ${isSpent ? 'badge-spent' : 'badge-active'}">${isSpent ? '소진됨' : '유효'}</span>
          <span class="text-[10px] ${ddayColor} font-bold">${dday}</span>
          ${logs.length > 0 ? `<span class="text-[10px] text-slate-400">내역 ${logs.length}건</span>` : ''}
        </div>
        <button onclick="openDetail('${key}')" class="text-[10px] text-blue-400 underline">상세</button>
      </div>
      <h3 class="font-bold text-base text-slate-800 mt-1">${escapeHtml(r[COL.NAME])}</h3>
      <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(r[COL.LOCATION]||'')}</p>
      <p class="text-sm text-slate-700 mt-2 leading-relaxed">${escapeHtml(r[COL.BENEFIT]||'')}</p>
      ${cautionsHtml}
      ${lastLogHtml}

      <div class="flex gap-2 mt-3">
        ${isSpent ?

// ============================================================
//  스와이프
// ============================================================
function setupSwipe(el, row) {
  const bg = el.querySelector('.swipe-bg');
  const inner = el.querySelector('.card-inner');
  let startX = 0, dx = 0;

  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; dx = 0; }, { passive: true });
  el.addEventListener('touchmove', e => {
    dx = startX - e.touches[0].clientX;
    if (dx < 0) dx = 0;
    if (dx > 140) dx = 140;
    inner.style.transform = `translateX(-${dx}px)`;
    bg.style.opacity = dx / 140;
  }, { passive: true });
  el.addEventListener('touchend', async () => {
    if (dx > 90) {
      if (confirm(`"${row[COL.NAME]}" 혜택을 삭제하시겠습니까? (휴지통 30일 복구 가능)`)) {
        await deleteBenefit(row);
        return;
      }
    }
    inner.style.transform = '';
    bg.style.opacity = 0;
    dx = 0;
  });
}

async function handleFileSelect(event) {
  const files = [...event.target.files];
  event.target.value = '';
  if (files.length === 0) return;

  showLoading(`이미지 분석 중... (0/${files.length})`);
  let doneCount = 0;
  const newItems = [];

  for (const file of files) {
    try {
      const base64 = await fileToBase64(file);
      updateLoadingMsg(`이미지 분석 중... (${doneCount}/${files.length})`);
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action:'analyzeImageOnly', base64, mimeType: file.type })
      });
      const j = await res.json();
      const item = {
        id: 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        kind: 'image', base64, mimeType: file.type, fileName: file.name,
        analyzed: j.result === 'success' ? j.data : null,
        failed: j.result !== 'success',
        error: j.error || null, createdAt: Date.now()
      };
      await dbPut(item);
      newItems.push(item);
    } catch (e) {
      const item = {
        id: 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        kind: 'image', failed: true, error: e.message,
        fileName: file.name, createdAt: Date.now()
      };
      await dbPut(item);
      newItems.push(item);
    }
    doneCount++;
  }

  hideLoading();
  await loadPending();

  if (newItems.length === 1) openReviewSingle(newItems[0]);
  else openReviewList();
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

document.addEventListener('paste', async (e) => {
  const items = [...(e.clipboardData?.items || [])];
  const imageItems = items.filter(it => it.type.startsWith('image/'));
  if (imageItems.length > 0) {
    e.preventDefault();
    const files = imageItems.map(it => it.getAsFile()).filter(Boolean);
    if (files.length > 0) {
      await handleFileSelect({ target: { files, value: '' } });
    }
  }
});

        <div class="space-y-2">
          ${failed.map(p => `
            <div class="review-item failed">
              <div class="flex justify-between items-center">
                <div>
                  <p class="text-sm font-bold">${escapeHtml(p.fileName || '(텍스트)')}</p>
                  <p class="text-[11px] text-red-500">${escapeHtml(p.error || '오류')}</p>
                </div>
                <button onclick="discardPending('${p.id}')" class="text-xs text-red-500 font-bold">삭제</button>
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  `;
  document.getElementById('reviewListOverlay').hidden = false;
}

function reviewCardHtml(p) {
  const a = p.analyzed || {};
  const name = a.name?.value || '(이름 없음)';
  const loc = a.location?.value || '';
  const bene = a.benefit?.value || '';
  return `
    <div class="review-item" onclick="openReviewSingle(pendingItems.find(x=>x.id==='${p.id}'))">
      <div class="flex justify-between items-start">
        <div class="flex-1">
          <p class="text-sm font-bold text-slate-800">${escapeHtml(name)}</p>
          <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(loc)}</p>
          <p class="text-[11px] text-slate-400 mt-0.5 line-clamp-2">${escapeHtml(bene).slice(0,80)}</p>
        </div>
        <span class="text-xs text-blue-500 font-bold">검수 →</span>
      </div>
    </div>
  `;
}

function avgConfidence(analyzed) {
  if (!analyzed) return 'low';
  const fields = ['name','location','benefit','cautions','expiry'];
  const scores = fields.map(f => {
    const c = analyzed[f]?.confidence;
    return c === 'high' ? 3 : c === 'medium' ? 2 : 1;
  });
  const avg = scores.reduce((a,b)=>a+b,0) / scores.length;
  if (avg >= 2.6) return 'high';
  if (avg >= 2) return 'medium';
  return 'low';
}

function closeReviewList(e) {
  if (e && e.target.id !== 'reviewListOverlay') return;
  document.getElementById('reviewListOverlay').hidden = true;
}

async function saveAllConfident() {
  const confident = pendingItems.filter(p => !p.failed && avgConfidence(p.analyzed) === 'high');
  if (confident.length === 0) return;
  if (!confirm(`${confident.length}개 항목을 일괄 저장하시겠습니까?`)) return;

  showLoading(`저장 중... (0/${confident.length})`);
  for (let i = 0; i < confident.length; i++) {
    updateLoadingMsg(`저장 중... (${i}/${confident.length})`);
    await saveOnePending(confident[i]);
  }
  hideLoading();
  await loadPending();
  await loadData();
  closeReviewList();
  if (pendingItems.length > 0) openReviewList();
  else alert('모두 저장되었습니다!');
}

async function saveOnePending(p) {
  const a = p.analyzed || {};
  const confirmed = {
    name: a.name?.value || '',
    location: a.location?.value || '',
    benefit: a.benefit?.value || '',
    cautions: a.cautions?.value || '',
    expiry: a.expiry?.value || ''
  };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action:'saveConfirmed',
        confirmed,
        base64: p.kind === 'image' ? p.base64 : null,
        mimeType: p.kind === 'image' ? p.mimeType : null,
        fileName: p.fileName || null
      })
    });
    const j = await res.json();
    if (j.result === 'success') {
      await dbDelete(p.id);
      pendingItems = pendingItems.filter(x => x.id !== p.id);
    }
    return j;
  } catch (e) { return { result:'error', error: e.message }; }
}

async function discardPending(id) {
  if (!confirm('이 항목을 폐기하시겠습니까?')) return;
  await dbDelete(id);
  await loadPending();
  if (pendingItems.length === 0) closeReviewList();
  else openReviewList();
}

// ============================================================
//  검수 - 개별
// ============================================================
let currentReview = null;

function openReviewSingle(p) {
  if (!p) return;
  currentReview = p;
  closeReviewList();

  const a = p.analyzed || {
    name: {value:'', confidence:'low'},
    location: {value:'', confidence:'low'},
    benefit: {value:'', confidence:'low'},
    cautions: {value:'', confidence:'low'},
    expiry: {value:'', confidence:'low'}
  };

  const sheet = document.getElementById('reviewSheet');
  const originalHtml = p.kind === 'image' ? `
    <div class="bg-slate-100 rounded-2xl overflow-hidden mb-4">
      <img src="data:${p.mimeType};base64,${p.base64}" class="w-full block">
    </div>
  ` : `
    <div class="bg-slate-50 rounded-2xl p-4 mb-4 text-sm text-slate-700 whitespace-pre-wrap">${escapeHtml(p.text || '')}</div>
  `;

  sheet.innerHTML = `
    <div class="sticky top-0 bg-white pt-4 pb-3 px-5 border-b border-slate-100 flex justify-between items-center z-10">
      <div>
        <h2 class="font-black text-slate-800">검수 및 확정</h2>
        <p class="text-[10px] text-slate-400">원본과 비교하며 수정하세요</p>
      </div>
      <button onclick="closeReview()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500">×</button>
    </div>
    <div class="px-5 pt-4">
      <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">원본</p>
      ${originalHtml}

      <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">AI 분석 결과</p>

      <div class="space-y-3 bg-white rounded-2xl border border-slate-100 p-4">
        ${fieldRow('name', '제목', a.name, 'text')}
        ${fieldRow('location', '장소/브랜드', a.location, 'text')}
        ${fieldRow('benefit', '혜택 상세', a.benefit, 'textarea', '할인율/캐시백/기념품/한도 등 자유 서술')}
        ${fieldRow('cautions', '주의사항', a.cautions, 'textarea', '결제방식, 최소금액, 제외항목 등')}
        ${fieldRow('expiry', '만료일', a.expiry, 'date')}
      </div>

      ${a.notes ? `<p class="mt-3 text-xs text-amber-600 bg-amber-50 p-2.5 rounded-xl">💡 ${escapeHtml(a.notes)}</p>` : ''}

      ${p.kind === 'image' ? `
      <div class="mt-4 ai-panel p-3">
        <p class="text-[11px] font-bold text-blue-500 mb-2">🤖 AI에게 다시 물어보기</p>
        <div class="flex gap-2">
          <input id="reviewAiInput" type="text" placeholder="예: 주의사항 다시 찾아줘"
            class="flex-1 p-2 text-sm rounded-xl bg-white border border-blue-100">
          <button onclick="reReviewAsk()" class="bg-blue-600 text-white px-3 rounded-xl text-xs font-bold">질문</button>
        </div>
        <div id="reviewAiResponse" hidden class="mt-3 ai-bubble p-3 text-sm text-slate-700"></div>
      </div>` : ''}

      <div class="mt-5 flex gap-2">
        <button onclick="cancelReview()" class="flex-1 py-3 rounded-xl bg-red-50 text-red-600 font-bold text-sm">폐기</button>
        <button onclick="skipReview()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">나중에</button>
        <button onclick="confirmReview()" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">저장</button>
      </div>
    </div>
  `;
  document.getElementById('reviewOverlay').hidden = false;
}

function fieldRow(key, label, fieldObj, inputType, hint) {
  const val = fieldObj?.value ?? '';
  const conf = fieldObj?.confidence || 'low';
  const confLabel = conf === 'high' ? '확실' : conf === 'medium' ? '확인요망' : '누락';

  let inputHtml = '';
  if (inputType === 'textarea') {
    inputHtml = `<textarea id="rf_${key}" rows="3" class="w-full p-2 text-sm rounded-lg bg-slate-50 border border-slate-200 resize-none"${hint?` placeholder="${escapeAttr(hint)}"`:''}>${escapeHtml(val)}</textarea>`;
  } else if (inputType === 'date') {
    inputHtml = `<input id="rf_${key}" type="date" value="${escapeAttr(val)}" class="w-full p-2 text-sm rounded-lg bg-slate-50 border border-slate-200">`;
  } else {
    inputHtml = `<input id="rf_${key}" type="text" value="${escapeAttr(val)}" class="w-full p-2 text-sm rounded-lg bg-slate-50 border border-slate-200">`;
  }

  return `
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-bold text-slate-600">${label}</label>
        <span class="badge conf-badge-${conf}"><span class="conf-dot conf-${conf}"></span>${confLabel}</span>
      </div>
      ${inputHtml}
    </div>
  `;
}

function closeReview(e) {
  if (e && e.target.id !== 'reviewOverlay') return;
  document.getElementById('reviewOverlay').hidden = true;
  currentReview = null;
}

async function confirmReview() {
  if (!currentReview) return;
  const confirmed = {
    name: document.getElementById('rf_name').value.trim(),
    location: document.getElementById('rf_location').value.trim(),
    benefit: document.getElementById('rf_benefit').value.trim(),
    cautions: document.getElementById('rf_cautions').value.trim(),
    expiry: document.getElementById('rf_expiry').value || ''
  };
  if (!confirmed.name) { alert('제목을 입력해주세요.'); return; }

  showLoading('저장 중...');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action:'saveConfirmed',
        confirmed,
        base64: currentReview.kind === 'image' ? currentReview.base64 : null,
        mimeType: currentReview.kind === 'image' ? currentReview.mimeType : null,
        fileName: currentReview.fileName || null
      })
    });
    const j = await res.json();
    hideLoading();
    if (j.result === 'success') {
      await dbDelete(currentReview.id);
      await loadPending();
      closeReview();
      await loadData();
      if (pendingItems.length > 0) {
        if (confirm(`${pendingItems.length}개 항목이 더 있습니다. 이어서 검수할까요?`)) {
          openReviewList();
        }
      }
    } else alert('저장 실패: ' + (j.error || ''));
  } catch (e) { hideLoading(); alert('서버 오류'); }
}

async function cancelReview() {
  if (!currentReview) return;
  if (!confirm('이 항목을 완전히 폐기하시겠습니까?')) return;
  await dbDelete(currentReview.id);
  await loadPending();
  closeReview();
  if (pendingItems.length > 0) openReviewList();
}

function skipReview() {
  closeReview();
  if (pendingItems.length > 0) openReviewList();
}

async function reReviewAsk() {
  if (!currentReview || currentReview.kind !== 'image') return;
  const q = document.getElementById('reviewAiInput').value.trim();
  if (!q) return;
  const resp = document.getElementById('reviewAiResponse');
  resp.hidden = false;
  resp.textContent = '분석 중...';

  const currentData = {
    name: document.getElementById('rf_name').value,
    location: document.getElementById('rf_location').value,
    benefit: document.getElementById('rf_benefit').value,
    cautions: document.getElementById('rf_cautions').value,
    expiry: document.getElementById('rf_expiry').value
  };

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action:'askFollowup',
        question: q, currentData,
        base64: currentReview.base64,
        mimeType: currentReview.mimeType
      })
    });
    const j = await res.json();
    let html = `<span class="text-blue-500 font-bold">💬 AI</span><br>${escapeHtml(j.answer||'').replace(/\n/g,'<br>')}`;
    if (j.suggestedUpdate) {
      html += `<div class="mt-2 pt-2 border-t border-blue-100">`;
      Object.entries(j.suggestedUpdate).forEach(([k,v]) => {
        html += `<button onclick="applyFieldUpdate('${k}','${escapeAttr(String(v))}')" class="text-xs bg-blue-600 text-white px-2 py-1 rounded-lg font-bold mr-1 mb-1">${k}: ${escapeHtml(String(v).slice(0,30))} 적용</button>`;
      });
      html += `</div>`;
    }
    resp.innerHTML = html;
  } catch (e) { resp.textContent = 'AI 응답 실패'; }
}

function applyFieldUpdate(key, val) {
  const el = document.getElementById('rf_' + key);
  if (el) el.value = val;
  alert(`${key} 업데이트됨`);
}

// ============================================================
//  탭 전환
// ============================================================
function showTab(name, btn) {
  document.getElementById('homeTab').hidden = (name !== 'home');
  document.getElementById('trashTab').hidden = (name !== 'trash');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (name === 'trash') renderTrashList();
}

// ============================================================
//  유틸
// ============================================================
function showLoading(msg) {
  document.getElementById('loadingOverlay').hidden = false;
  document.getElementById('loadingMsg').textContent = msg || '처리 중...';
}
function updateLoadingMsg(msg) { document.getElementById('loadingMsg').textContent = msg; }
function hideLoading() { document.getElementById('loadingOverlay').hidden = true; }

function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s) {
  return String(s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/\n/g,' ');
}

// ============================================================
//  시작
// ============================================================
(async () => {
  await loadPending();
  await loadData();
  if (pendingItems.length > 0) {
    setTimeout(() => {
      if (confirm(`검수 대기 중 ${pendingItems.length}개가 있습니다. 지금 검수할까요?`)) {
        openReviewList();
      }
    }, 500);
  }
})();
</script>
</body>
